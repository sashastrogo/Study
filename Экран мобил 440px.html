<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>phone-mockup-clean-440x956-dynamic-island-16</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .phone {
      width: 440px;
      height: 956px;
      border-radius: 42px;
      background: #101114;
      padding: 14px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
    }

    .island {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 34px;
      border-radius: 999px;
      background: #050608;
      z-index: 4;
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .screen::-webkit-scrollbar {
      display: none;
    }

    .canvas {
      width: 440px;
      min-height: 3200px;
      background: #ffffff;
    }

    @media (max-width: 520px) {
      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .island { top: 24px; }
      .screen { border-radius: 0; }
      .canvas { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="phone" aria-label="Чистый мокап смартфона 440 на 956 с Dynamic Island">
    <div class="island" aria-hidden="true"></div>
    <div class="screen">
      <div class="canvas" aria-label="Белый прокручиваемый холст 440 на 3200"></div>
    </div>
  </div>
</body>
</html>
